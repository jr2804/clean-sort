# type checker rules - see https://docs.astral.sh/ty/reference/rules/

[environment]
python-version = "3.13"

[src]
include = [
    "src",
    "tests",
]
# tests/data/* are pyreorder fixtures — deliberately-unsorted inputs plus the
# sorter's canonical outputs — not maintained, type-clean code.
exclude = ["tests/data"]

[terminal]
error-on-warning = true
