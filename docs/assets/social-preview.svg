<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="pyreorder — reorders a Python module's top-level statements into a canonical section layout: imports, constants, classes, functions">
  <title>pyreorder — reorders a Python module's top-level statements into a canonical section layout</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04211f"/>
      <stop offset="55%" stop-color="#0b3f3a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="4%" r="68%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <text x="80" y="150" font-family="ui-monospace, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="26" letter-spacing="4" fill="#5eead4">PYTHON SOURCE ORGANISER</text>
  <text x="80" y="278" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="112" font-weight="800" letter-spacing="-2" fill="#f0fdfa">pyreorder</text>
  <text x="80" y="354" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" fill="#ccfbf1">Reorders a module's top-level statements into a</text>
  <text x="80" y="398" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" fill="#ccfbf1">canonical section layout — formatting preserved.</text>

  <text x="80" y="460" font-family="ui-monospace, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" letter-spacing="3" fill="#7dd3c0">SECTION ORDER</text>

  <g font-family="ui-monospace, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="28" fill="#e6fffb">
