[project]
name = "pyreorder"
dynamic = ["version"]
description = "AST-based Python module reorganizer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Jan Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
keywords = ["sort", "sorting", "ast", "cst", "refactor", "clean-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "libcst>=1.1.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
pyreorder = "pyreorder.cli.app:main"
rord = "pyreorder.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyreorder"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=pyreorder --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 90

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.pyreorder]
# pyreorder configuration. See https://github.com/jr2804/pyreorder for the full schema.
# Disabling: add a `# pyreorder: off` comment anywhere in a file's header to skip it.

[tool.pyreorder.module]
# Ordered list of section buckets. Each top-level statement is classified into one.
# Recognized sections: imports, typing_imports, module_constants, runtime_setup, enums,
# dataclasses, classes, functions, dunder_exports, main_block. Anything unrecognized lands in "other" (kept last).
sections = [
    "imports",
    "typing_imports",
    "module_constants",
    "runtime_setup",
    "enums",
    "dataclasses",
    "classes",
    "functions",
    "dunder_exports",
    "main_block",
]

# Per-section in-section strategy: "keep" | "alpha" | "stepdown" | "abstraction".
# stepdown/abstraction (dependency order) are only meaningful for functions & classes;
# applied elsewhere they fall back to "alpha". Omit a section to default to "keep".
#
# WARNING: "alpha" is safe for imports/enums, but reordering interdependent
# constants or classes can break runtime order (NameError/MRO). Only enable it
# per-section once you have checked the result with `pyreorder diff`.
[tool.pyreorder.strategy]
enums = "alpha"
# functions = "stepdown"   # caller before callee (top-down narrative)
# classes = "keep"

[tool.pyreorder.class_methods]
# Reorder methods *within* each class (undersort semantics).
enabled = true
order = ["public", "protected", "private"]
method_type_order = ["instance", "class", "static"]

# Back-compat: pyreorder also reads [tool.undersort] for class_methods order/method_type_order
# when [tool.pyreorder.class_methods] is absent.
[tool.undersort]
order = ["public", "protected", "private"]
method_type_order = ["instance", "class", "static"]
