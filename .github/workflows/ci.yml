name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8

jobs:

  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: true
    - name: Install dependencies
      run: mise dev || uv sync --dev
    - name: Run linter
      run: mise lint || ruff check src/ tests/
    - name: Check spelling
      run: mise spell || codespell src/ tests/

  tests:
    needs: [quality]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: true
    - name: Install dependencies
      run: mise dev || uv sync --dev
    - name: Run tests with coverage
      run: mise test || pytest --cov=pyreorder --cov-report=term-missing --cov-report=xml
    - name: Upload coverage artifact
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml

  docs:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Install dependencies
      run: mise dev || uv sync --dev
    - name: Build documentation
      run: mise docs || zensical build --clean
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site/
