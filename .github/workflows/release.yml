# Release workflow (calendar versioning).
# Push to main -> compute next YYYY.M.N tag -> tag -> build -> publish PyPI
# (trusted publishing, OIDC) -> create GitHub Release with wheel+sdist.
#
# Add `[skip release]` to the head commit message to suppress the release.
#
# PyPI trusted-publisher setup (one-time, manual):
#   https://pypi.org/manage/project/pyreorder/publishing/
#   Owner: jr2804  Repository: jr2804/pyreorder
#   Workflow filename: release.yml  Workflow name: release
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  release:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for PyPI trusted publishing (OIDC)

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Compute next calendar version
      id: version
      run: |
        set -euo pipefail
        existing_head_tag="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' | head -n 1 || true)"
        if [ -n "$existing_head_tag" ]; then
          echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
          echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        year="$(date -u +%Y)"
        month="$(date -u +%m)"
        git fetch --tags --force
        prefix="${year}.${month}."
        highest="$(git tag --list "${prefix}*" | sed -n "s/^${year}\\.${month}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -n 1)"
        counter="${highest:-0}"
        next="$((counter + 1))"
        version="${year}.${month}.${next}"
        while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
          next="$((next + 1))"
          version="${year}.${month}.${next}"
        done
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "needs_tag=true" >> "$GITHUB_OUTPUT"

    - name: Stamp the changelog
      if: steps.version.outputs.needs_tag == 'true'
      run: |
        set -euo pipefail
        version="${{ steps.version.outputs.version }}"
        release_date="$(date -u +%Y-%m-%d)"
        uv run python - "$version" "$release_date" <<'PY'
        import re
        import sys
        from pathlib import Path

        version, release_date = sys.argv[1], sys.argv[2]
        path = Path("CHANGELOG.md")
        text = path.read_text(encoding="utf-8")
        stamped, count = re.subn(
            r"^## \[Unreleased\]\s*$",
            f"## [{version}] - {release_date}",
            text,
            count=1,
            flags=re.MULTILINE,
        )
        if not count:
            print("No [Unreleased] section; nothing to stamp.")
            sys.exit(0)
        path.write_text(stamped, encoding="utf-8")
        print(f"Stamped [Unreleased] as [{version}] - {release_date}.")
        PY
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- CHANGELOG.md; then
          echo "Changelog unchanged; skipping commit."
          exit 0
        fi
        git add CHANGELOG.md
        # [skip release] keeps this push from starting a second release run; the
        # tag step below tags this commit, so the tag carries the stamped file.
        git commit -m "chore: stamp the changelog for ${version} [skip release]"
        git push origin HEAD:main

    - name: Create and push tag
      if: steps.version.outputs.needs_tag == 'true'
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        version="${{ steps.version.outputs.version }}"
        git tag -a "$version" -m "Release $version"
        git push origin "$version"

    - name: Build package
      run: uv build

    - name: Publish to PyPI (trusted publishing, OIDC)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        files: dist/*
        generate_release_notes: true
