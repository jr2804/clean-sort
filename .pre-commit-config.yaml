# Pre-commit hooks configuration for Clean Sort
#
# Install pre-commit hooks:
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: preorder
        name: preorder
        description: AST-based structural sorter (this repo).
        entry: uv run preorder run --
        language: system
        files: ^src/.*\.py$
        pass_filenames: true

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--check-filenames]
        exclude: ^(tests/|\.git|\.tox|.*\.min\.js|.*\.min\.css)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        exclude: ^skills/


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
